<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Europe Trip Planner</title>
    <meta name="description" content="Plan a multi-week route across Europe: nights per city, daily spend, and how you travel between stops." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%231b4332'/%3E%3Ctext x='32' y='42' text-anchor='middle' font-family='Georgia,serif' font-weight='700' font-size='28' fill='%23fffcf7'%3ECF%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="planner.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <p class="eyebrow">Multi-city · multi-week</p>
          <h1>Europe trip planner</h1>
        </div>
        <label class="start-date">
          Start
          <input type="date" id="start-date" />
        </label>
        <div class="actions">
          <button type="button" id="share-trip">Share link</button>
          <button type="button" class="ghost" id="print-trip">Print</button>
          <button type="button" class="ghost" id="reset-trip">Clear trip</button>
        </div>
      </header>

      <section class="stats" id="stats"></section>

      <div class="workspace">
        <aside class="sidebar">
          <div class="add-panel">
            <label class="search-label">
              Add a city
              <input
                type="search"
                id="city-search"
                placeholder="Any city or town in Europe…"
                autocomplete="off"
              />
            </label>
            <ul class="suggestions" id="suggestions" hidden></ul>
            <p class="hint">Search any European city or town, or click a dot on the map.</p>
          </div>
          <ol class="itinerary" id="itinerary"></ol>
        </aside>
        <div class="map-wrap">
          <div id="map"></div>
          <div class="legend">
            <span data-mode="train">Train</span>
            <span data-mode="plane">Plane</span>
            <span data-mode="bus">Bus</span>
            <span data-mode="car">Car</span>
            <span data-mode="ferry">Ferry</span>
          </div>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="planner.js"></script>
  </body>
</html>
